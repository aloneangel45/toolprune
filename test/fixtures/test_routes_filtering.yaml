version: "1"
server:
  transport: "stdio"
pruning:
  tier: "aggressive"
routing:
  default_profile: "full"
upstreams:
  - id: "read_db_service"
    transport: "stdio"
    command: "go"
    args: ["version"]
  - id: "writer_mutator_service"
    transport: "stdio"
    command: "go"
    args: ["version"]
  - id: "read_logs_service"
    transport: "stdio"
    command: "go"
    args: ["version"]
  - id: "destructive_cleaner_service"
    transport: "stdio"
    command: "go"
    args: ["version"]
